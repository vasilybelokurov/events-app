name: Refresh events and deploy

# Why the deploy step is explicit: a commit made with GITHUB_TOKEN does not
# trigger a GitHub Pages build, so a cron job that only commits the new JSON
# would never update the published site.
on:
  schedule:
    - cron: "15 6 * * *"      # 06:15 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "collector/**"
      - "data/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write     # commit the refreshed data file
  pages: write        # deploy
  id-token: write     # required by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the offline test suite
        run: python -m pytest -q

      # The collector exits non-zero when a source is degraded, but it has
      # already written the data by then: healthy sources refreshed and the
      # broken one kept its last good records.  Letting that exit code stop the
      # job here would block the commit, the artifact and the deploy -- one
      # broken venue freezing the whole site, which is the thing this design
      # exists to avoid.  So the status is captured, publication proceeds, and
      # the run is failed at the very end by "Report collector health".
      - name: Collect events
        id: collect
        env:
          EVENTS_CONTACT: ${{ github.server_url }}/${{ github.repository }}/issues
          EVENTS_CACHE_TTL: "0"          # never serve a cached page in CI
        run: |
          set +e
          python -m collector.build --out docs/data/events.json -v
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # A corrupted data file must never reach the site.  This has happened:
      # a `union` merge driver interleaved two copies of events.json into
      # something that parsed nowhere.
      # Subject tagging runs here, not on anybody's laptop.  Three things make
      # that affordable on a CPU runner:
      #   * the model is 2.5 GB and is restored from the Actions cache, so it
      #     is downloaded once rather than every morning;
      #   * the classification cache is keyed on the event's own text, so only
      #     genuinely new wording is sent to the model -- between two real
      #     consecutive builds that was *one* event;
      #   * `--budget` caps the work, so a venue publishing a whole season
      #     cannot run this job for an hour.  The rest is picked up tomorrow.
      # If any of it fails the build carries on: `collector.build` falls back
      # to keyword tags for anything the model has not read, so a bad morning
      # for Ollama degrades the tagging instead of stopping the site.
      - name: Tag events with the local model
        id: classify
        continue-on-error: true
        timeout-minutes: 20
        run: |
          # No Actions cache for the model: measured on a cache miss, the
          # runner pulled all 2.5 GB and was ready in *11 seconds*, which
          # restoring a cache of that size would not beat.  So it costs
          # nothing of the repo's 10 GB cache budget and there is no eviction
          # behaviour to reason about.  The runner also has ~86 GB free, not
          # the ~14 GB the documentation led me to expect.
          echo "::group::runner capacity"
          df -h / | tail -1
          echo "::endgroup::"
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          start=$(date +%s)
          ollama pull qwen3:4b
          echo "model ready in $(( $(date +%s) - start ))s"
          du -sh ~/.ollama/models 2>/dev/null || true
          python -m collector.classify --budget 60

      - name: Report tagging
        if: always()
        run: |
          if [ "${{ steps.classify.outcome }}" != "success" ]; then
            echo "::warning::Model tagging did not finish; new events keep their keyword tags."
          fi
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/classifications.json")
          d = json.loads(p.read_text()) if p.exists() else {"entries": {}}
          n = len(d.get("entries", {}))
          blank = sum(1 for v in d["entries"].values() if not v.get("labels"))
          print(f"{n} texts classified, {blank} of them 'cannot tell'")
          PY

      - name: Re-apply the model's tags
        if: always()
        run: python -m collector.build --retag -v

      - name: Validate the published data
        run: |
          python - <<'CHECK'
          import json, sys
          doc = json.load(open("docs/data/events.json"))
          assert doc["event_count"] == len(doc["events"]), "event_count disagrees"
          assert doc["sources"], "no sources recorded"
          seen = set()
          for r in doc["events"]:
              assert r["id"] not in seen, f"duplicate id {r['id']}"
              seen.add(r["id"])
              assert r["title"] and r["url"], f"incomplete record {r['id']}"
          print(f"{doc['event_count']} records, {len(doc['sources'])} sources: valid")
          CHECK

      - name: Show what changed
        run: git --no-pager diff --stat -- docs/data/events.json || true

      # Both files, and the early exit tests both: the classification cache is
      # the expensive half.  Staging only events.json threw the model's work
      # away on every run, so each morning would have reclassified the whole
      # catalogue from nothing and never accumulated anything.
      - name: Commit the refreshed data
        run: |
          if git diff --quiet -- docs/data/events.json data/classifications.json; then
            echo "No change."
            exit 0
          fi
          git config user.name  "events-app bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/events.json data/classifications.json
          git commit -m "data: refresh events ($(date -u +%Y-%m-%d))"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # Publication has happened; now make the run red so the degradation is
      # not silent.  `always()` keeps this from being skipped by an earlier
      # failure, and the deploy job depends on the artifact, not on this.
      - name: Report collector health
        if: always()
        run: |
          code="${{ steps.collect.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::error::The collector reported a degraded source (exit $code)."
            echo "The site was still updated from the healthy sources; see the"
            echo "build warnings above and the source panel on the page."
            exit 1
          fi
          echo "All sources healthy."

  deploy:
    # Depends on the artifact, not on the health verdict: a degraded source
    # must not stop the healthy ones reaching the site.
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
