name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "40 7 * * 1"      # Mondays: check the live sources for drift

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  live-sources:
    # Source drift is the main way this project breaks, so the live checks run
    # on a schedule (and on demand) rather than on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          EVENTS_CONTACT: ${{ github.server_url }}/${{ github.repository }}/issues
          EVENTS_CACHE_TTL: "0"
        run: python -m pytest -m network -q
