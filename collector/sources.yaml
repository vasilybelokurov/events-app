  - key: science_museum
    name: Science Museum
    kind: venue
    homepage: https://www.sciencemuseum.org.uk/see-and-do/technicians-david-sainsbury-gallery
    verify_url: https://www.sciencemuseum.org.uk/see-and-do/technicians-david-sainsbury-gallery
    docs: https://www.sciencemuseum.org.uk/see-and-do/technicians-david-sainsbury-gallery
    terms: https://www.sciencemuseum.org.uk/terms-and-conditions
    title: "Technicians: The David Sainsbury Gallery"
    venue_name: Science Museum, Exhibition Road
    city: London
    lat: 51.4978
    lon: -0.1745
    priority: 40
    verified: 2026-09-21
    allow_blocked: true
    schedule: Any time during museum opening hours
    summary: >
      A gallery built around technician jobs rather than school subjects.
    topics: [Careers, Engineering, Medicine, Film and media, Energy]
    expect: ["Technicians"]
    confirm:
      - phrase: "Free entry"
        sets:
          price_text: Free
      - phrase: "Open daily"
        sets:
          when_text: "Open daily; see the museum page for hours"
    notes: >
      The Science Museum serves 403 to anything that is not a desktop browser,
      so `allow_blocked` keeps the venue in the list while the record says
      plainly that nothing was confirmed today.

