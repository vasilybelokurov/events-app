      max_pages: 25
    selectors:
      item: "li.o-grid__item:has(a.c-media--event)"
      title: .c-media__title
      link: a.c-media--event
      date: ["time[itemprop=startDate]", ".c-media__datetime"]
      date_attr: datetime
      end: ["time[itemprop=endDate]"]
      end_attr: datetime
      time: .c-media__datetime
      summary: .c-media__summary
      price: .c-media__labels
    notes: >
      The occupational gap this fills is the one no museum covers: the
      Library's business programme (market research, intellectual property,
      payments, start-ups) alongside writing, publishing, archives,
      conservation and library science.  Entrepreneur, publisher, editor,
      archivist, librarian, patent agent and market researcher are otherwise
      almost absent from the catalogue.

      Listing notes, all learnt the hard way:

      * The row *is* the anchor, so `item` selects its `li` wrapper and `link`
        selects the anchor inside it.
      * Two exhibitions are pinned to every page; `parse` drops the repeats by
        event id.
      * The site's own next-page hrefs accumulate junk parameters
        (`?amp;page=6&page=2`), so `pages.param` drives the walk instead.
        16 pages as of 2026-09-22; `max_pages` is 25 because exhausting the
        budget is reported as a truncated walk, not as the end.
      * Dates carry no year ("Saturday 3 January") and write times with a dot
        ("10.30"), which is why `collector.models` grew `_clock_dots` and
        `_roll_yearless`.  Without those, a January event landed in the past
        and "20 October 10.30" landed in the year 2010.
      * `assume_future_dates` is earned here and nowhere else so far: this is
        a live what's-on listing, which advertises only what is coming, so a
        yearless January is the January ahead.  It must stay off for a page
        that keeps a past programme up -- see `cambridge_festival`.
      * Rows that give a recurrence instead of a date ("Most Fridays at
        11.30", "Daily") are dropped, because a pattern is not a date.  The
        Treasures Tour and the building tours are lost that way; a `venue`
        entry would be the way to carry them.
      * Only free events are labelled, so a row with no label leaves the price
        unknown rather than being claimed as free.
