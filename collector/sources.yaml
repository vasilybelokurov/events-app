    verified: 2026-09-21
    topics: [Medicine, Surgery, History of science]
    selectors:
      item: .card
      title: .card__link
      link: .card__link
      date: '[class*="col-start-1"]'
      time: '[class*="col-start-1"]'
      summary: '[class*="leading-snug"]'
      status: .card__cta
    notes: >
      Surgery, medical technology and the history of healthcare.  The listing
      uses utility classes, so the date selector matches on a class fragment
      rather than a full class name; the date field is free text carrying both
      ends of a run ("10th September-31st October 2026"), which the range
      parser reads.  The "Sold out" / "Book now" button is read as status.

