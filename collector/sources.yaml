# Source registry — the single authoritative list of where data comes from.
#
# EVERY source must be listed here, and every source must be *accessible and
# verifiable*: `python -m collector.verify` walks this file, fetches each
# `verify_url`, parses it, and reports what it found.  Nothing may enter
# events.json from a source that is not in this file.
#
# Required of every entry
#   key          stable; becomes the prefix of every event id from this source
#   name         shown in the page's source panel
#   kind         adapter (see collector/adapters/)
#   homepage     human-facing page a person can open to check the source
#   verify_url   machine-facing URL the verifier fetches
#   raw_url      optional: the raw source data, linked from the page's source
#                panel; defaults to verify_url
#   docs         where the interface is documented, or how it was discovered
#   terms        licence / terms-of-use page, or "unstated"
#   priority     tie-break during de-duplication (lower wins)
#   verified     date the adapter was last confirmed against the live source
#
#   expect_events  set false for a source that is knowingly dormant, so an
#                  empty result is reported as a note rather than a failure
#
#   career_topics  topics that are true of **every** event from this source,
#                  used for career tagging.  Distinct from `topics`, which is
#                  what the venue programmes overall and is shown on the page:
#                  applying that union per event tagged a woodworking class
#                  "Computing & AI" because the V&A also runs digital media.
#                  Leave it out unless the claim holds for every single event.
#
#   assume_future_dates
#                  true only for a listing that advertises what is *coming*:
#                  a date written without a year ("Saturday 3 January") is
#                  then read as the next such date rather than as one that
#                  has just gone.  Leave it off for any page that keeps a
#                  past programme published, or the collector will invent
#                  future dates for events that already happened.
#
# Optional
#   hand_written  true if the records are human claims needing periodic
#                 re-checking; defaults to true for `kind: curated`.  Entries
#                 of a hand-written source are link-checked on every build and
#                 their `verified_on` date expires after 90 days.
#
# Adding a venue should mean adding a block here, not writing code.

sources:
  - key: rigb
    name: Royal Institution
    kind: drupal_jsonapi
    homepage: https://www.rigb.org/whats-on
    endpoint: https://www.rigb.org/jsonapi/node/event
    verify_url: https://www.rigb.org/jsonapi/node/event?page%5Blimit%5D=1
    docs: https://www.drupal.org/docs/core-modules-and-themes/core-modules/jsonapi-module
    terms: https://www.rigb.org/terms-and-conditions
    site: https://www.rigb.org
    venue_name: The Royal Institution, 21 Albemarle Street
    city: London
    lat: 51.5090
    lon: -0.1422
    limit: 50
    priority: 10
    verified: 2026-09-21
    notes: >
      Public Drupal JSON:API, discovered by requesting /jsonapi and looking for
      a node--event resource.  Carries an age taxonomy (Young people 13+,
      Families, Adults, Children 12 and under), topics, prices and the
      Eventbrite booking link.  The most reliable source in this project: it
      needs no scraping and the venue maintains it.

